<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="sidepanel_title">AIChats Sidebar</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="panel-header">
    <button class="btn-icon btn-newchat" id="btnNewChat" data-i18n-title="sidepanel_newChat" title="新建会话">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="nc-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7"/>
            <stop offset="50%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#06b6d4"/>
          </linearGradient>
        </defs>
        <path fill="url(#nc-gradient)" d="M9 3.5h6a5.5 5.5 0 0 1 5.5 5.5v6a5.5 5.5 0 0 1-5.5 5.5H9A5.5 5.5 0 0 1 3.5 15V9A5.5 5.5 0 0 1 9 3.5z"/>
        <path fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" d="M7.5 12h9M12 7.5v9"/>
      </svg>
    </button>
    <div class="custom-select" id="chatSelect">
      <div class="custom-select-trigger" id="chatSelectTrigger"></div>
      <div class="custom-select-dropdown" id="chatSelectDropdown"></div>
    </div>
    <select id="themeSelect" class="theme-select" data-i18n-title="common_switchTheme" title="切换主题">
      <option value="system" data-i18n="common_themeSystem">☯ 跟随系统</option>
      <option value="light" data-i18n="common_themeLight">☀ 浅色</option>
      <option value="dark" data-i18n="common_themeDark">☾ 深色</option>
    </select>
    <select id="localeSelect" class="theme-select">
      <option value="zh_CN">🇨🇳 中文</option>
      <option value="en">🇺🇸 English</option>
    </select>
    <button class="btn-icon" id="btnSettings"
            data-i18n-title="common_openSettings"
            data-i18n-aria-label="common_openSettings"
            title="设置">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M11.5 2a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M9.05 3a2.5 2.5 0 0 1 4.9 0H16v1h-2.05a2.5 2.5 0 0 1-4.9 0H0V3zM4.5 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M2.05 8a2.5 2.5 0 0 1 4.9 0H16v1H6.95a2.5 2.5 0 0 1-4.9 0H0V8zm9.45 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m-2.45 1a2.5 2.5 0 0 1 4.9 0H16v1h-2.05a2.5 2.5 0 0 1-4.9 0H0v-1z"/>
      </svg>
    </button>
    <button class="btn-icon" id="btnOpenTab"
            data-i18n-title="sidepanel_openInNewTab"
            data-i18n-aria-label="sidepanel_openInNewTab"
            title="在浏览器标签页打开当前站点">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
    </button>
    <button class="btn-icon btn-github" id="btnGithub" title="GitHub">
      <svg width="16" height="16" viewBox="0 0 16 16">
        <defs>
          <linearGradient id="gh-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7"/>
            <stop offset="50%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#06b6d4"/>
          </linearGradient>
        </defs>
        <path fill="url(#gh-gradient)" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </button>
  </div>
  <div class="panel-body">
    <div class="chip-toolbar" id="chipToolbar" hidden>
      <div id="chipBar" class="chip-bar" hidden></div>
    </div>
    <div id="chatFrames" class="chat-frames"></div>
    <div id="loadingOverlay" class="loading-overlay" hidden>
      <div class="loading-logo" id="loadingLogo"></div>
      <div class="loading-label" id="loadingLabel"></div>
      <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>
    <div id="emptyState" class="empty-state" hidden>
      <p data-i18n="sidepanel_emptyText">还没有启用聊天站点</p>
      <button id="btnSidebarOptions" data-i18n="sidepanel_goSettings">去设置</button>
    </div>

    <!-- Draggable compose FAB: opens the manual prompt modal -->
    <button id="composeFab" class="compose-fab" type="button"
            data-i18n-title="sidepanel_manualPromptTitle"
            data-i18n-aria-label="sidepanel_manualPromptTitle"
            title="手动编写提示词">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>
      </svg>
    </button>
  </div>

  <!-- Manual prompt compose modal (chat-style composer + history) -->
  <div id="composeModal" class="modal-overlay" hidden>
    <div class="modal modal-compose" role="dialog" aria-modal="true"
         data-i18n-aria-label="sidepanel_manualPromptTitle" aria-label="手动编写提示词">
      <button id="composeClose" class="compose-close" type="button"
              data-i18n-title="common_close" data-i18n-aria-label="common_close" title="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
      <div class="compose-history">
        <div class="compose-history-head">
          <div id="historySearchWrap" class="history-search-wrap" hidden>
            <svg class="history-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/>
              <path d="M21 21l-4.3-4.3"/>
            </svg>
            <input id="historySearch" class="history-search" type="search" autocomplete="off"
                   data-i18n-placeholder="sidepanel_historySearch"
                   data-i18n-aria-label="sidepanel_historySearch"
                   placeholder="搜索历史提示词">
          </div>
        </div>
        <div id="historyList" class="history-list" tabindex="0"
             data-i18n-aria-label="sidepanel_historyTitle"></div>
        <div id="historyNoResults" class="history-empty" data-i18n="sidepanel_historyNoResults" hidden>没有匹配的提示词</div>
      </div>
      <div class="composer">
        <textarea id="composeText" rows="3"
                  data-i18n-placeholder="options_promptsAddContent"
                  placeholder="提示内容，支持 {url}、{title}、{clipboard} 和 {html} 变量"></textarea>
        <div class="composer-foot">
          <div class="var-pills">
            <button type="button" class="var-btn" data-var="{url}">{url}</button>
            <button type="button" class="var-btn" data-var="{title}">{title}</button>
            <button type="button" class="var-btn" data-var="{clipboard}">{clipboard}</button>
            <button type="button" class="var-btn" data-var="{html}">{html}</button>
          </div>
          <button id="composeSubmit" class="composer-send" type="button"
                  data-i18n-title="sidepanel_composeSubmit"
                  data-i18n-aria-label="sidepanel_composeSubmit"
                  title="发送（Ctrl+Enter）" aria-label="发送（Ctrl+Enter）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5"/>
              <path d="M6 11l6-6 6 6"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <script src="store.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
